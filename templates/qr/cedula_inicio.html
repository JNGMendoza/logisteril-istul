<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Retiro de insumos – LogiSteril</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { background: #f0f4f8; font-size: 16px; margin: 0; }
    .brand { background: #1a2035; color: #fff; padding: 14px 20px;
             display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 38px; height: 38px; border-radius: 8px; background: #0d6efd;
                  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand small { font-size: .72rem; color: #8895b3; display: block; margin-top: 1px; }
    .container-form { max-width: 420px; margin: 0 auto; padding: 32px 20px 60px; }
    .icon-circle { width: 72px; height: 72px; border-radius: 50%; background: #e3f0ff;
                   display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
    .card-form { background: #fff; border-radius: 16px;
                 box-shadow: 0 4px 20px rgba(0,0,0,.1); padding: 28px 24px; }
    .cedula-input { border: 2px solid #dee2e6; border-radius: 12px; padding: 14px 16px;
                    font-size: 1.3rem; font-weight: 600; letter-spacing: 2px;
                    text-align: center; width: 100%; outline: none; transition: border .2s; }
    .cedula-input:focus { border-color: #0d6efd; box-shadow: 0 0 0 4px rgba(13,110,253,.12); }
    .btn-confirmar { background: #0d6efd; color: #fff; border: none; border-radius: 12px;
                     padding: 15px; font-size: 1rem; font-weight: 600; width: 100%;
                     margin-top: 16px; cursor: pointer; transition: background .15s; }
    .btn-confirmar:active { background: #0b5ed7; }
    .error-box { background: #f8d7da; border-radius: 10px; padding: 12px 16px;
                 font-size: .88rem; color: #842029; margin-bottom: 16px;
                 display: flex; align-items: flex-start; gap: 8px; }
    .hint { text-align: center; color: #888; font-size: .82rem; margin-top: 20px; }
  </style>
</head>
<body>

<div class="brand">
  <div class="brand-icon">
    <i class="bi bi-hospital" style="font-size:1.2rem;color:#fff"></i>
  </div>
  <div>
    <span style="font-weight:700;font-size:.95rem">LogiSteril</span>
    <small>Central de Esterilización · ISTUL</small>
  </div>
</div>

<div class="container-form">

  <div class="icon-circle">
    <i class="bi bi-person-badge-fill" style="font-size:2rem;color:#0d6efd"></i>
  </div>

  <h5 class="text-center fw-bold mb-1">Identificación</h5>
  <p class="text-center text-muted mb-4" style="font-size:.9rem">
    Ingresa tu número de cédula para registrar el retiro de insumos.
  </p>

  {% if error %}
  <div class="error-box">
    <i class="bi bi-exclamation-triangle-fill" style="flex-shrink:0;margin-top:2px"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <div class="card-form">
    <form method="POST" autocomplete="off">
      <label style="font-weight:600;font-size:.88rem;margin-bottom:8px;display:block">
        Número de cédula
      </label>
      <input type="text" name="cedula" id="cedula" class="cedula-input"
             placeholder="0000000000" maxlength="20"
             inputmode="numeric" autofocus
             value="{{ request.form.get('cedula', '') }}">
      <button type="submit" class="btn-confirmar">
        <i class="bi bi-arrow-right-circle me-2"></i>Continuar
      </button>
    </form>
  </div>

  <p class="hint">
    <i class="bi bi-shield-check me-1"></i>
    Tu cédula solo se usa para identificarte en este retiro.
  </p>

</div>

</body>
</html>
