<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR inválido – LogiSteril</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
  </style>
</head>
<body>
  <div class="text-center px-4">
    <div style="width:72px;height:72px;border-radius:50%;background:#f8d7da;
                display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
      <span style="font-size:2rem">✕</span>
    </div>
    <h5 class="fw-bold">Código QR inválido</h5>
    <p class="text-muted">Este código no es válido o ha expirado.<br>
       Solicita un nuevo QR al administrador del sistema.</p>
  </div>
</body>
</html>
