server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Redirigir HTTP -> HTTPS (activar después de instalar certificado SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos servidos directamente por Nginx (más rápido)
    location /static {
        alias /var/www/logisteril/static;
        expires 30d;
    }

    access_log /var/log/nginx/logisteril_access.log;
    error_log  /var/log/nginx/logisteril_error.log;
}
